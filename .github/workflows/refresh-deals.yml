name: Refresh deals daily

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (about 6am UK)
  workflow_dispatch:         # also lets you press "Run workflow" by hand
    inputs:
      skip_eatclub:
        description: "Skip the slow EatClub check (quick test run)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check First Table pages (new, changed, and oldest ones)
        # If First Table can't be read today, keep yesterday's data and carry on with everything else.
        run: |
          set -o pipefail
          python _build/refresh.py 2>&1 | tee ft.log || echo "::warning title=First Table check failed::$(tail -4 ft.log | tr '\n' ' ' | cut -c1-600)"
          rm -f ft.log
      - name: Check EatClub venues and deals
        if: ${{ !inputs.skip_eatclub }}
        run: python _build/eatclub.py
        continue-on-error: true
        env:
          EC_WORKERS: "3"
          EC_PAUSE: "0.6"
      - name: Build the site
        run: python _build/build.py
      - name: Find missing websites and Instagram on OpenStreetMap (weekly), then rebuild
        run: |
          python _build/osm_links.py || true
          python _build/build.py
      - name: Read restaurant websites for Instagram, menu and dead links (robots.txt respected), then rebuild
        env:
          WM_WORKERS: "10"
        run: |
          python _build/webmeta.py || true
          python _build/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "TableFifty bot"
          git config user.email "hello@tablefifty.co.uk"
          git add -A
          if git diff --cached --quiet; then echo "No changes today"; exit 0; fi
          git commit -m "Daily deal refresh $(date -u +%F)"
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
